# docker-compose.yml
version: '3'

services:

    nginx:
        build:
            context: dockerfiles
            dockerfile: ./dockerfiles/nginx/Dockerfile
        depends_on:
            - daphne
        ports:
            - 80:80

    database:
        build:
            context: dockerfiles
            dockerfile: ./dockerfiles/postgres/Dockerfile
        container_name: 'database'
        environment:
            POSTGRES_DB: "codefuturebank"
            POSTGRES_USER: "max"
            POSTGRES_PASSWORD: "123Max123Ma_"
        expose:
            - 5432

    daphne:
        build:
            context: dockerfiles
            dockerfile: ./dockerfiles/web/Dockerfile
        container_name: 'daphne'
        tty: true
        command: python3 -u -m daphne web_django.asgi:application -b daphne -p 8000
        depends_on:
            - database
        restart: always
        expose:
           - 8000


networks:
    database_network:
        driver: bridge
